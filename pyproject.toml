[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowsec"
version = "0.7.0"
description = "CI/CD pipeline security analyzer — scans GitHub Actions, GitLab CI, and Azure DevOps configs for attack vectors"
readme = "PYPI_README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["security", "devsecops", "cicd", "github-actions", "sast", "pipeline-security"]
authors = [
    { name = "Vansh Bhardwaj", email = "Scorpio.vansh@gmail.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
remote = [
    "PyGithub>=2.1.1",
    "python-gitlab>=4.4.0",
    "httpx>=0.27.0",
]
ai = [
    "anthropic>=0.40.0",
]
dev = [
    "flowsec[remote,ai]",
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.3",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "bandit>=1.7.8",
    "hatch>=1.12.0",
    "types-PyYAML>=6.0.1",
]

[project.scripts]
flowsec = "flowsec.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/flowsec"]

[tool.ruff]
line-length = 150
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Rule descriptions and remediations are long prose strings — leave them on one line.
"src/flowsec/rules/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flowsec --cov-report=term-missing"

[tool.coverage.run]
source = ["src/flowsec"]
